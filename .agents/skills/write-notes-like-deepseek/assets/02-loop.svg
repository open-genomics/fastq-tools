<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" width="100%" height="100%">
  <title>三步闭环：方案稿 → 代码笔记同交 → 归档封存</title>
  <defs>
    <pattern id="light-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#e2e8f0" stroke-width="0.75"/>
    </pattern>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L8 4.5 L0 9 Z" fill="#0284c7"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L8 4.5 L0 9 Z" fill="#059669"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Segoe UI', 'Microsoft YaHei', sans-serif; }
    .code { font-family: 'JetBrains Mono', monospace; }
  </style>

  <!-- 背景 -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect width="100%" height="100%" fill="url(#light-grid)"/>

  <!-- 标题区 -->
  <text x="60" y="74" fill="#0f172a" font-size="40" font-weight="800">每一步都有人管：方案、落地、归档</text>

  <!-- ========== 卡 1：先写方案稿（蓝） ========== -->
  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="400" height="376" rx="16" fill="#ffffff" stroke="#7dd3fc" stroke-width="2" filter="url(#soft-shadow)"/>
    <circle cx="36" cy="34" r="17" fill="#0284c7"/>
    <text x="36" y="40" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">1</text>
    <text x="64" y="41" fill="#0f172a" font-size="22" font-weight="800">先写方案稿</text>
    <rect x="300" y="19" width="76" height="30" rx="15" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="338" y="39" fill="#0369a1" font-size="14.5" font-weight="800" text-anchor="middle">动手前</text>

    <!-- 场景插图：proposed/ 文件夹 + 稿纸 + 笔 + 评审通过章 -->
    <rect x="24" y="60" width="352" height="138" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <g transform="translate(24, 60)">
      <rect x="160" y="30" width="84" height="50" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
      <rect x="172" y="44" width="60" height="7" rx="3.5" fill="#e2e8f0"/>
      <rect x="172" y="58" width="44" height="7" rx="3.5" fill="#e2e8f0"/>
      <g transform="translate(258, 24) rotate(14)">
        <rect x="0" y="0" width="11" height="44" rx="2" fill="#fbbf24" stroke="#d97706" stroke-width="1.3"/>
        <path d="M 0 44 L 11 44 L 5.5 54 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
      </g>
      <rect x="30" y="42" width="64" height="14" rx="7" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
      <rect x="30" y="56" width="190" height="78" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
      <rect x="48" y="72" width="112" height="8" rx="4" fill="#e2e8f0"/>
      <rect x="48" y="88" width="84" height="8" rx="4" fill="#e2e8f0"/>
      <text x="50" y="120" fill="#0369a1" font-size="15" class="code">proposed/</text>
      <g transform="translate(194, 112) rotate(-10)">
        <rect x="-52" y="-16" width="104" height="32" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2.2"/>
        <text x="0" y="5" fill="#059669" font-size="14" font-weight="800" text-anchor="middle">方案定稿</text>
      </g>
    </g>

    <!-- 要点 -->
    <circle cx="30" cy="225" r="3.5" fill="#0284c7"/>
    <text x="46" y="230" fill="#334155" font-size="15.5">写清要解决什么问题</text>
    <circle cx="30" cy="258" r="3.5" fill="#0284c7"/>
    <text x="46" y="263" fill="#334155" font-size="15.5">被放弃的路，先写它最强的理由</text>
    <circle cx="30" cy="291" r="3.5" fill="#0284c7"/>
    <text x="46" y="296" fill="#334155" font-size="15.5">再说为什么不用，确认了才动手</text>

    <!-- 结论条 -->
    <rect x="24" y="318" width="352" height="42" rx="11" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2"/>
    <text x="200" y="345" fill="#0369a1" font-size="15" font-weight="700" text-anchor="middle">没想清楚的稿子，不动手</text>
  </g>

  <!-- 卡 1 -> 卡 2 箭头 -->
  <path d="M 464 328 L 494 328" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" marker-end="url(#ab)"/>

  <!-- ========== 卡 2：代码和笔记一起交（绿） ========== -->
  <g transform="translate(500, 140)">
    <rect x="0" y="0" width="400" height="376" rx="16" fill="#ffffff" stroke="#6ee7b7" stroke-width="2" filter="url(#soft-shadow)"/>
    <circle cx="36" cy="34" r="17" fill="#059669"/>
    <text x="36" y="40" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">2</text>
    <text x="64" y="41" fill="#0f172a" font-size="22" font-weight="800">代码和笔记一起交</text>
    <rect x="300" y="19" width="76" height="30" rx="15" fill="#f0fdf4" stroke="#059669" stroke-width="1.2"/>
    <text x="338" y="39" fill="#047857" font-size="14.5" font-weight="800" text-anchor="middle">施工时</text>

    <!-- 场景插图：implemented/ 文件夹 + 反向注释代码窗 -->
    <rect x="24" y="60" width="352" height="138" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <g transform="translate(24, 60)">
      <rect x="40" y="24" width="60" height="40" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
      <rect x="48" y="33" width="42" height="5" rx="2.5" fill="#e2e8f0"/>
      <rect x="48" y="41" width="30" height="5" rx="2.5" fill="#e2e8f0"/>
      <rect x="24" y="44" width="56" height="14" rx="7" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
      <rect x="24" y="58" width="120" height="76" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
      <rect x="36" y="94" width="72" height="7" rx="3.5" fill="#e2e8f0"/>
      <text x="32" y="122" fill="#047857" font-size="15" class="code">implemented/</text>
      <rect x="150" y="22" width="196" height="112" rx="10" fill="#0f172a"/>
      <text x="164" y="42" fill="#94a3b8" font-size="15" class="code">pay.ts</text>
      <rect x="164" y="52" width="96" height="7" rx="3.5" fill="#334155"/>
      <rect x="164" y="68" width="66" height="7" rx="3.5" fill="#3f4b5f"/>
      <text x="164" y="94" fill="#4ade80" font-size="15" class="code">// Note: 为何选 A</text>
      <text x="164" y="112" fill="#4ade80" font-size="15" class="code">// 见 .agents/notes/</text>
      <path d="M 150 100 L 142 100" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#ag)"/>
    </g>

    <!-- 要点 -->
    <circle cx="30" cy="225" r="3.5" fill="#059669"/>
    <text x="46" y="230" fill="#334155" font-size="15.5">笔记只写已经发生的事实</text>
    <circle cx="30" cy="258" r="3.5" fill="#059669"/>
    <text x="46" y="263" fill="#334155" font-size="15.5">代码入口留一行注释，指回这篇笔记</text>

    <!-- 结论条 -->
    <rect x="24" y="318" width="352" height="42" rx="11" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
    <text x="200" y="345" fill="#047857" font-size="15" font-weight="700" text-anchor="middle">代码和笔记，缺一个都不算完工</text>
  </g>

  <!-- 卡 2 -> 卡 3 箭头 -->
  <path d="M 904 328 L 934 328" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" marker-end="url(#ab)"/>

  <!-- ========== 卡 3：老方案干净归档（灰蓝） ========== -->
  <g transform="translate(940, 140)">
    <rect x="0" y="0" width="400" height="376" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#soft-shadow)"/>
    <circle cx="36" cy="34" r="17" fill="#64748b"/>
    <text x="36" y="40" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">3</text>
    <text x="64" y="41" fill="#0f172a" font-size="22" font-weight="800">老方案干净归档</text>
    <rect x="300" y="19" width="76" height="30" rx="15" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
    <text x="338" y="39" fill="#475569" font-size="14.5" font-weight="800" text-anchor="middle">被取代时</text>

    <!-- 场景插图：archived/ 文件夹 + 已归档章 + 封印锁 -->
    <rect x="24" y="60" width="352" height="138" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <g transform="translate(24, 60)">
      <rect x="40" y="24" width="60" height="40" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
      <rect x="48" y="33" width="42" height="5" rx="2.5" fill="#e2e8f0"/>
      <rect x="48" y="41" width="30" height="5" rx="2.5" fill="#e2e8f0"/>
      <rect x="24" y="44" width="56" height="14" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.8"/>
      <rect x="24" y="58" width="124" height="76" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.8"/>
      <rect x="38" y="94" width="76" height="7" rx="3.5" fill="#e2e8f0"/>
      <text x="36" y="122" fill="#475569" font-size="13.5" class="code">archived/</text>
      <g transform="translate(72, 56) rotate(-9)">
        <rect x="-36" y="-15" width="72" height="30" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
        <text x="0" y="5" fill="#475569" font-size="14" font-weight="800" text-anchor="middle">已归档</text>
      </g>
      <circle cx="278" cy="76" r="34" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
      <path d="M 268 74 A 10 10 0 0 1 288 74" fill="none" stroke="#64748b" stroke-width="2.5"/>
      <rect x="264" y="74" width="28" height="24" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.8"/>
      <circle cx="278" cy="84" r="2.6" fill="#64748b"/>
      <line x1="278" y1="86" x2="278" y2="92" stroke="#64748b" stroke-width="2"/>
      <text x="278" y="132" fill="#475569" font-size="14" font-weight="800" text-anchor="middle">永久封存</text>
    </g>

    <!-- 要点 -->
    <circle cx="30" cy="225" r="3.5" fill="#64748b"/>
    <text x="46" y="230" fill="#334155" font-size="15.5">旧笔记标清楚：被哪篇新笔记取代</text>
    <circle cx="30" cy="258" r="3.5" fill="#64748b"/>
    <text x="46" y="263" fill="#334155" font-size="15.5">封起来不许改，谁篡改立刻报警</text>

    <!-- 结论条 -->
    <rect x="24" y="318" width="352" height="42" rx="11" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="200" y="345" fill="#475569" font-size="15" font-weight="700" text-anchor="middle">新会话第一眼就看到：这篇作废了</text>
  </g>

  <!-- ========== 底部回绕箭头：回到第 1 步 ========== -->
  <path d="M 1140 516 V 584 H 260 V 530" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/>
  <g>
    <rect x="542" y="566" width="316" height="36" rx="18" fill="#ffffff" stroke="#bae6fd" stroke-width="1.4" filter="url(#soft-shadow)"/>
    <text x="700" y="590" fill="#0369a1" font-size="15" font-weight="700" text-anchor="middle">下一轮改动，回到第 1 步重新写方案稿</text>
  </g>
</svg>
