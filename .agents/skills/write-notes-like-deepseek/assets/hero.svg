<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680" width="100%" height="100%">
  <title>十几个 PR 冲刷下，决策笔记让代码库保持有序</title>
  <defs>
    <pattern id="light-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#e2e8f0" stroke-width="0.75"/>
    </pattern>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L8 4.5 L0 9 Z" fill="#dc2626"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L8 4.5 L0 9 Z" fill="#059669"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Segoe UI', 'Microsoft YaHei', sans-serif; }
    .code { font-family: 'JetBrains Mono', monospace; }
  </style>

  <!-- 背景 -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect width="100%" height="100%" fill="url(#light-grid)"/>

  <!-- 标题区 -->
  <g transform="translate(60, 28)">
    <text x="0" y="72" fill="#0f172a" font-size="40" font-weight="800">AI 每天都在帮你写代码，可它不知道之前为啥这样写</text>
  </g>

  <!-- ========== 左：没有笔记（失控） ========== -->
  <g transform="translate(60, 148)">
    <rect x="0" y="0" width="620" height="380" rx="18" fill="#ffffff" stroke="#fecaca" stroke-width="2" filter="url(#soft-shadow)"/>

    <rect x="24" y="20" width="112" height="30" rx="15" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="76" y="40" fill="#b91c1c" font-size="15" font-weight="800" text-anchor="middle">没有笔记</text>

    <!-- PR 卡片群 -->
    <g>
      <g transform="rotate(-4 63 85)"><rect x="24" y="68" width="78" height="34" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.4"/><text x="63" y="90" fill="#b91c1c" font-size="14" font-weight="700" text-anchor="middle" class="code">PR #1</text></g>
      <g transform="rotate(3 151 85)"><rect x="112" y="68" width="78" height="34" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.4"/><text x="151" y="90" fill="#b91c1c" font-size="14" font-weight="700" text-anchor="middle" class="code">PR #2</text></g>
      <g transform="rotate(-2 239 85)"><rect x="200" y="68" width="78" height="34" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.4"/><text x="239" y="90" fill="#b91c1c" font-size="14" font-weight="700" text-anchor="middle" class="code">PR #3</text></g>
      <g transform="rotate(3 63 129)"><rect x="24" y="112" width="78" height="34" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.4"/><text x="63" y="134" fill="#b91c1c" font-size="14" font-weight="700" text-anchor="middle" class="code">PR #4</text></g>
      <g transform="rotate(-3 151 129)"><rect x="112" y="112" width="78" height="34" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.4"/><text x="151" y="134" fill="#b91c1c" font-size="14" font-weight="700" text-anchor="middle" class="code">PR #5</text></g>
      <g transform="rotate(4 239 129)"><rect x="200" y="112" width="78" height="34" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.4"/><text x="239" y="134" fill="#b91c1c" font-size="14" font-weight="700" text-anchor="middle" class="code">PR #6</text></g>
      <g transform="rotate(-2 63 173)"><rect x="24" y="156" width="78" height="34" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.4"/><text x="63" y="178" fill="#b91c1c" font-size="14" font-weight="700" text-anchor="middle" class="code">PR #7</text></g>
      <g transform="rotate(2 151 173)"><rect x="112" y="156" width="78" height="34" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.4"/><text x="151" y="178" fill="#b91c1c" font-size="14" font-weight="700" text-anchor="middle" class="code">PR #8</text></g>
      <g transform="rotate(-4 239 173)"><rect x="200" y="156" width="78" height="34" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.4"/><text x="239" y="178" fill="#b91c1c" font-size="14" font-weight="700" text-anchor="middle" class="code">PR #9</text></g>
      <g transform="rotate(3 63 217)"><rect x="24" y="200" width="78" height="34" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.4"/><text x="63" y="222" fill="#b91c1c" font-size="14" font-weight="700" text-anchor="middle" class="code">PR #10</text></g>
      <g transform="rotate(-3 151 217)"><rect x="112" y="200" width="78" height="34" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.4"/><text x="151" y="222" fill="#b91c1c" font-size="14" font-weight="700" text-anchor="middle" class="code">PR #11</text></g>
      <g transform="rotate(2 239 217)"><rect x="200" y="200" width="78" height="34" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.4"/><text x="239" y="222" fill="#b91c1c" font-size="14" font-weight="700" text-anchor="middle" class="code">PR #12</text></g>
    </g>

    <!-- 混乱箭头 -->
    <path d="M 284 106 C 300 108 312 116 322 128" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/>
    <path d="M 284 168 C 300 168 312 169 322 171" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/>
    <path d="M 284 222 C 300 218 312 210 322 200" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/>

    <!-- 代码库窗口（失控） -->
    <rect x="330" y="82" width="262" height="184" rx="12" fill="#0f172a"/>
    <circle cx="348" cy="104" r="4" fill="#f87171"/>
    <circle cx="364" cy="104" r="4" fill="#fbbf24"/>
    <circle cx="380" cy="104" r="4" fill="#34d399"/>
    <text x="398" y="108" fill="#94a3b8" font-size="15" class="code">仓库 · src/</text>
    <rect x="350" y="128" width="190" height="8" rx="4" fill="#334155"/>
    <rect x="350" y="150" width="150" height="8" rx="4" fill="#3f4b5f"/>
    <rect x="350" y="172" width="170" height="8" rx="4" fill="#ef4444"/>
    <text x="524" y="181" fill="#f87171" font-size="15" font-weight="700">依赖冲突</text>
    <rect x="350" y="194" width="120" height="8" rx="4" fill="#334155"/>
    <rect x="350" y="216" width="160" height="8" rx="4" fill="#3f4b5f"/>

    <!-- 三个红色现象标签 -->
    <g transform="translate(24, 288)">
      <rect x="0" y="0" width="184" height="44" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
      <path d="M 22 14 L 36 14 L 29 32 Z" fill="#dc2626"/>
      <text x="29" y="28" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">!</text>
      <text x="46" y="29" fill="#b91c1c" font-size="15" font-weight="700">模块边界被打穿</text>

      <rect x="194" y="0" width="184" height="44" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
      <path d="M 216 14 L 230 14 L 223 32 Z" fill="#dc2626"/>
      <text x="223" y="28" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">!</text>
      <text x="236" y="29" fill="#b91c1c" font-size="14" font-weight="700">看不见当初为啥这样写</text>

      <rect x="388" y="0" width="184" height="44" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
      <path d="M 410 14 L 424 14 L 417 32 Z" fill="#dc2626"/>
      <text x="417" y="28" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">!</text>
      <text x="434" y="29" fill="#b91c1c" font-size="15" font-weight="700">老方案又提了一遍</text>
    </g>
  </g>

  <!-- ========== 右：配上笔记（有序） ========== -->
  <g transform="translate(720, 148)">
    <rect x="0" y="0" width="620" height="380" rx="18" fill="#ffffff" stroke="#a7f3d0" stroke-width="2" filter="url(#soft-shadow)"/>

    <rect x="24" y="20" width="112" height="30" rx="15" fill="#f0fdf4" stroke="#059669" stroke-width="1.2"/>
    <text x="76" y="40" fill="#047857" font-size="15" font-weight="800" text-anchor="middle">配上笔记</text>

    <!-- 同样的 PR，不同的结果 -->
    <g transform="rotate(-3 44 65)"><rect x="24" y="54" width="40" height="22" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/><text x="44" y="69" fill="#047857" font-size="11" font-weight="700" text-anchor="middle" class="code">PR #4</text></g>
    <g transform="rotate(2 88 65)"><rect x="68" y="54" width="40" height="22" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/><text x="88" y="69" fill="#047857" font-size="11" font-weight="700" text-anchor="middle" class="code">PR #7</text></g>
    <g transform="rotate(-2 132 65)"><rect x="112" y="54" width="40" height="22" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/><text x="132" y="69" fill="#047857" font-size="11" font-weight="700" text-anchor="middle" class="code">PR #9</text></g>
    <text x="158" y="69" fill="#6b7280" font-size="13">还是那 12 个 PR</text>

    <!-- 代码库窗口（有序） -->
    <rect x="24" y="84" width="230" height="170" rx="12" fill="#0f172a"/>
    <circle cx="42" cy="105" r="4" fill="#f87171"/>
    <circle cx="58" cy="105" r="4" fill="#fbbf24"/>
    <circle cx="74" cy="105" r="4" fill="#34d399"/>
    <text x="92" y="109" fill="#94a3b8" font-size="15" class="code">仓库 · src/</text>
    <rect x="42" y="128" width="150" height="8" rx="4" fill="#334155"/>
    <rect x="42" y="150" width="120" height="8" rx="4" fill="#3f4b5f"/>
    <rect x="42" y="172" width="140" height="8" rx="4" fill="#334155"/>
    <text x="42" y="212" fill="#4ade80" font-size="15" class="code">// Note: 为何用 SQLite</text>
    <text x="42" y="236" fill="#4ade80" font-size="15" class="code">//    见 .agents/notes/</text>

    <!-- 笔记卡片 -->
    <g transform="translate(350, 72)">
      <rect x="0" y="0" width="246" height="216" rx="14" fill="#ffffff" stroke="#059669" stroke-width="1.8" filter="url(#soft-shadow)"/>
      <path d="M 0 14 Q 0 0 14 0 L 232 0 Q 246 0 246 14 L 246 46 L 0 46 Z" fill="#f0fdf4"/>
      <rect x="16" y="13" width="20" height="20" rx="3" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
      <line x1="20" y1="20" x2="32" y2="20" stroke="#059669" stroke-width="1.6"/>
      <line x1="20" y1="26" x2="32" y2="26" stroke="#059669" stroke-width="1.6"/>
      <text x="46" y="30" fill="#065f46" font-size="20" font-weight="800">为什么这样定</text>
      <text x="16" y="84" fill="#334155" font-size="15">· 当年为什么选这条路</text>
      <text x="16" y="114" fill="#334155" font-size="15">· 放弃了哪几条备选</text>
      <text x="16" y="144" fill="#334155" font-size="15">· 动它之前，先读这篇</text>
      <rect x="16" y="164" width="214" height="28" rx="7" fill="#f0fdf4"/>
      <text x="123" y="182" fill="#047857" font-size="15" font-weight="700" text-anchor="middle">一篇笔记，全员共享</text>
    </g>

    <!-- 绿色路径：笔记 -> 代码 -->
    <text x="302" y="150" fill="#047857" font-size="15" font-weight="700" text-anchor="middle">先读笔记</text>
    <text x="302" y="170" fill="#047857" font-size="15" font-weight="700" text-anchor="middle">再改代码</text>
    <path d="M 350 198 C 322 196 292 192 264 190" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#ag)"/>

    <text x="310" y="330" fill="#047857" font-size="15" font-weight="700" text-anchor="middle">每个改这段代码的人，先读这一篇</text>
  </g>

  <!-- ========== 底部结论 ========== -->
  <g transform="translate(150, 556)">
    <rect x="0" y="0" width="1100" height="72" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.6" filter="url(#soft-shadow)"/>
    <circle cx="48" cy="36" r="20" fill="#f0fdf4" stroke="#059669" stroke-width="1.6"/>
    <rect x="41" y="25" width="14" height="20" rx="2.5" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
    <line x1="45" y1="32" x2="51" y2="32" stroke="#059669" stroke-width="1.6"/>
    <line x1="45" y1="38" x2="51" y2="38" stroke="#059669" stroke-width="1.6"/>
    <text x="84" y="45" fill="#0f172a" font-size="21" font-weight="800">代码说清楚「现在怎么跑」，笔记守住「为什么必须这样跑」</text>
  </g>
</svg>
