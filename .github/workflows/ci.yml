name: CI

# 触发策略（减轻 GitHub Actions 负担，重任务优先在本地运行）：
# - push/PR 仅自动运行 format（秒级，无构建）；
# - 静态分析、多编译器构建测试、sanitizer、fuzz、coverage 等重任务一律手动触发
#   （Actions 页面 Run workflow，选择 suite 范围：full/quick/sanitizers/coverage/fuzz）。
# 本地等价命令：
#   ./scripts/core/lint all -b build/gcc-debug          # format + clang-tidy + cppcheck
#   ./scripts/core/test --build-dir build/gcc-debug     # unit + integration + e2e + packaging
#   ./scripts/core/build --sanitizer asan && ./scripts/core/test  # sanitizer
#   ./scripts/core/test --coverage                      # 覆盖率报告
#   （fuzz 本地运行方式见 tools/fuzz/corpus/README.md）
on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: '运行范围: full=全部 | quick=快速构建测试 | sanitizers=仅 sanitizer | coverage=仅覆盖率 | fuzz=仅 fuzz 冒烟'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - quick
          - sanitizers
          - coverage
          - fuzz

permissions:
  contents: read

concurrency:
  # 组内区分事件类型：push（秒级 format）不得取消手动触发的长时间重任务
  # CI，反之亦然；同类事件（连续 push / 连续手动触发）仍保留"最新者胜"。
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CONAN_VERSION: '2.27.1'
  CMAKE_VERSION: '4.3.4'
  LLVM_VERSION: '21'

# 动态矩阵：job 级 if 不可用 matrix 上下文，只能用 fromJSON 的静态 matrix。
# push/PR 输出空数组（build-and-test 自然跳过）；workflow_dispatch 按 suite 映射。
# 注意：矩阵条目必须携带 build-and-test 引用的全部字段（compiler/cache_slug/
# build_command/test_command），缺失会被求值为空脚本并静默报绿。
jobs:
  resolve-matrix:
    name: Resolve matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          # 显式注入，避免依赖 GitHub 是否自动导出 INPUT_* 环境变量
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SUITE: ${{ inputs.suite || 'full' }}
        # 矩阵由 Python 生成：一次定义全部条目、按 suite 选择，避免 shell 多行
        # 单引号字符串（actionlint 的 shellcheck 集成会误报其内部 $()）。
        # $(nproc) 是命令字符串里的运行时展开，由 bash 执行 test_command 时解析。
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json, os

          def entry(name, compiler, cache_slug, build_command, test_command):
              return {"name": name, "compiler": compiler, "cache_slug": cache_slug,
                      "build_command": build_command, "test_command": test_command}

          gcc_build = "./scripts/core/build --preset gcc-release --no-lto"
          gcc_test = "./scripts/core/test --preset gcc-release --timeout 180"

          clang_tail = ("--build-dir build/ci-clang-{slug} "
                        "--conan-profile build-config/conan/profile-clang-ci --no-lto")
          clang_build_rel = "./scripts/core/build --compiler clang --type Release " + clang_tail
          clang_build_san = "./scripts/core/build --compiler clang --type Debug --sanitizer {san} " + clang_tail
          clang_test_rel = "./scripts/core/test --build-dir build/ci-clang-release --timeout 180"
          clang_test_san = ("ctest --test-dir build/ci-clang-{slug} --output-on-failure "
                            "--parallel $(nproc) --exclude-regex packaging_test")

          all_entries = [
              entry("GCC Release", "gcc", "gcc-release", gcc_build, gcc_test),
              entry("Clang Release", "clang", "clang-release",
                    clang_build_rel.format(slug="release"), clang_test_rel),
              entry("Clang ASan", "clang", "clang-asan",
                    clang_build_san.format(slug="asan", san="asan"),
                    clang_test_san.format(slug="asan")),
              entry("Clang TSan", "clang", "clang-tsan",
                    clang_build_san.format(slug="tsan", san="tsan"),
                    clang_test_san.format(slug="tsan")),
              entry("Clang UBSan", "clang", "clang-ubsan",
                    clang_build_san.format(slug="ubsan", san="ubsan"),
                    clang_test_san.format(slug="ubsan")),
          ]

          if os.environ["EVENT_NAME"] != "workflow_dispatch":
              matrix = []
          elif os.environ["INPUT_SUITE"] == "quick":
              matrix = all_entries[:2]
          elif os.environ["INPUT_SUITE"] == "sanitizers":
              matrix = all_entries[2:]
          elif os.environ["INPUT_SUITE"] in ("coverage", "fuzz"):
              # 这些 suite 只跑 coverage / fuzz-smoke 自己的 job，无构建矩阵
              matrix = []
          else:
              matrix = all_entries

          print("matrix=" + json.dumps(matrix))
          PYEOF
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup formatter
        uses: ./.github/actions/setup-cpp
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
          llvm-version: ${{ env.LLVM_VERSION }}
          install-conan: 'false'
          install-clang-format: 'true'

      - name: Run format check
        run: ./scripts/core/lint format-check

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    # 重任务：仅手动触发 full 范围时运行
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'full'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2
          # 刻意保留独立主键（-analysis-）而非与 build-and-test 统一：
          # 本 job 消费 gcc-Debug Conan 二进制，build-and-test(GCC) 消费 gcc-Release，
          # 二者 package_id 不同；而 actions/cache 不会覆盖已存在的同 key 条目，
          # 共享精确 key 会产生保存竞态，导致其中一方的包永远无法持久化。
          # restore-keys 前缀回退已提供跨 job 的缓存复用（源码包等共享内容）。
          key: ${{ runner.os }}-conan-gcc-analysis-${{ hashFiles('build-config/dependencies/**') }}
          restore-keys: |
            ${{ runner.os }}-conan-gcc-analysis-
            ${{ runner.os }}-conan-gcc-
            ${{ runner.os }}-conan-

      - name: Setup analysis toolchain
        uses: ./.github/actions/setup-cpp
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
          conan-version: ${{ env.CONAN_VERSION }}
          llvm-version: ${{ env.LLVM_VERSION }}
          compiler: gcc
          install-clang-tools: 'true'
          install-cppcheck: 'true'

      - name: Build gcc-debug preset
        run: ./scripts/core/build --preset gcc-debug --no-lto

      - name: Run clang-tidy
        run: ./scripts/core/lint tidy --preset gcc-debug

      - name: Run cppcheck
        run: ./scripts/core/lint cppcheck --preset gcc-debug

  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: resolve-matrix
    # 重任务：矩阵由 resolve-matrix 计算——push/PR 为空数组（本 job 跳过），
    # workflow_dispatch 按 suite 展开。不再需要 job 级 if（matrix 上下文在此不可用）。
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-matrix.outputs.matrix) }}

    env:
      # ccache 以环境变量方式注入 compiler launcher：CMake ≥ 3.17 会用同名环境变量初始化
      # CMAKE_<LANG>_COMPILER_LAUNCHER，无需修改 scripts/core/build（其不支持透传 -D）；
      # launcher 与 Conan toolchain 正交（在编译命令层注入），可正常穿透。
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      # 确保 sanitizer 发现问题时测试非零退出：UBSan 默认仅告警继续执行，必须
      # halt_on_error=1 才能使 ctest 失败；ASan/TSan 显式声明以保持行为一致。
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:print_stacktrace=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-${{ matrix.compiler }}-${{ hashFiles('build-config/dependencies/**') }}
          restore-keys: |
            ${{ runner.os }}-conan-${{ matrix.compiler }}-
            ${{ runner.os }}-conan-

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.ccache
          # cache_slug 编码 compiler + 构建类型 + sanitizer；主键随 commit 轮换，
          # restore-keys 回退到同 slug 的历史缓存
          key: ${{ runner.os }}-ccache-${{ matrix.cache_slug }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.cache_slug }}-
            ${{ runner.os }}-ccache-

      - name: Setup build toolchain
        uses: ./.github/actions/setup-cpp
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
          conan-version: ${{ env.CONAN_VERSION }}
          llvm-version: ${{ env.LLVM_VERSION }}
          compiler: ${{ matrix.compiler }}
          extra-apt-packages: ccache

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compiler_check=content
          ccache --zero-stats

      - name: Build preset
        run: ${{ matrix.build_command }}

      - name: Run tests
        run: ${{ matrix.test_command }}

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

  fuzz-smoke:
    name: Fuzz Smoke
    runs-on: ubuntu-latest
    # 重任务：仅手动触发 full / fuzz 范围时运行
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'full' || inputs.suite == 'fuzz')

    env:
      # 同 build-and-test：ccache launcher 经环境变量注入，与 Conan toolchain 正交
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      # fuzzer 内置 libFuzzer + ASan（+UBSan，见 cmake/modules/fq_fuzzing.cmake），
      # 显式声明确保发现问题时非零退出
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:print_stacktrace=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-clang-fuzz-${{ hashFiles('build-config/dependencies/**') }}
          restore-keys: |
            ${{ runner.os }}-conan-clang-fuzz-
            ${{ runner.os }}-conan-clang-
            ${{ runner.os }}-conan-

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-clang-fuzz-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-clang-fuzz-
            ${{ runner.os }}-ccache-clang-
            ${{ runner.os }}-ccache-

      - name: Setup build toolchain
        uses: ./.github/actions/setup-cpp
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
          conan-version: ${{ env.CONAN_VERSION }}
          llvm-version: ${{ env.LLVM_VERSION }}
          compiler: clang
          extra-apt-packages: ccache

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compiler_check=content
          ccache --zero-stats

      # scripts/core/build 不支持透传 -D 参数，故分两步：先用脚本完成 Conan 依赖与
      # 基础构建（复用其 Conan profile/版本推导逻辑），再重新 configure 打开
      # ENABLE_FUZZING（toolchain 与编译器已持久化在 CMakeCache，无需重复指定）
      - name: Build base project
        run: ./scripts/core/build --compiler clang --type Debug --build-dir build/ci-fuzz --conan-profile build-config/conan/profile-clang-ci --no-lto

      - name: Enable and build fuzzers
        run: |
          cmake -S . -B build/ci-fuzz -DENABLE_FUZZING=ON
          cmake --build build/ci-fuzz --parallel "$(nproc)" \
            --target fastq_parser_fuzzer fastq_mutator_fuzzer fastq_predicate_fuzzer fastq_statistics_fuzzer

      # 每个 fuzzer 跑 60s 冒烟（4×60s）；set -e 下任一 crash（非零退出）即失败整个 job，
      # crash 输入由 -artifact_prefix 收集到 fuzz-artifacts/ 并作为 artifact 上传供复现
      - name: Run fuzzers (60s each)
        run: |
          set -euo pipefail
          mkdir -p fuzz-artifacts tools/fuzz/corpus
          for fuzzer in fastq_parser_fuzzer fastq_mutator_fuzzer fastq_predicate_fuzzer fastq_statistics_fuzzer; do
            echo "::group::Fuzzing ${fuzzer}"
            ./build/ci-fuzz/fuzzers/"${fuzzer}" tools/fuzz/corpus \
              -max_total_time=60 \
              -max_len=4096 \
              -artifact_prefix="fuzz-artifacts/${fuzzer}-" \
              -print_final_stats=1
            echo "::endgroup::"
          done

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Upload fuzz crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzz-crash-artifacts
          path: fuzz-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  coverage:
    name: Coverage
    needs: resolve-matrix
    runs-on: ubuntu-latest
    # 重任务：仅手动触发 full / coverage 范围时运行。coverage 范围下 build-and-test
    # 矩阵为空，故依赖 resolve-matrix 而非 build-and-test；suite 为 coverage 时本 job
    # 独立运行，其它 suite 组合经 inputs.suite 直接短路（无需接受 skipped 结果）。
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'full' || inputs.suite == 'coverage')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2
          # 独立主键（-coverage-）：与 static-analysis 同为 gcc-Debug 二进制，但
          # actions/cache 不覆盖已存在的同 key 条目，共享精确 key 会因保存竞态
          # 使一方无法持久化；restore-keys 前缀回退已提供跨 job 复用。
          key: ${{ runner.os }}-conan-gcc-coverage-${{ hashFiles('build-config/dependencies/**') }}
          restore-keys: |
            ${{ runner.os }}-conan-gcc-coverage-
            ${{ runner.os }}-conan-gcc-
            ${{ runner.os }}-conan-

      - name: Setup coverage toolchain
        uses: ./.github/actions/setup-cpp
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
          conan-version: ${{ env.CONAN_VERSION }}
          compiler: gcc
          install-lcov: 'true'
          extra-python-packages: gcovr

      - name: Build coverage preset
        run: ./scripts/core/build --preset coverage --no-lto

      - name: Run coverage tests
        run: ctest --preset coverage --exclude-regex 'packaging_test'

      - name: Generate coverage report
        # --check-threshold 强制执行 build-config/coverage/thresholds.json 中的阈值
        # （行覆盖 ≥70%、函数覆盖 ≥80%），未达标时脚本非零退出使 job 失败
        run: bash ./scripts/dev/analysis/coverage-report -b build/coverage -o coverage_report --xml --check-threshold

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: coverage_report/coverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: coverage_report/
          retention-days: 7
